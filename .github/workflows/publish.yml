name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Pushing a tag like `v0.2.1` builds, tests and publishes create-authio-app
# to npm via OIDC trusted publishing (no token). Register the trusted
# publisher on npmjs.com (package Settings → Trusted Publisher → GitHub
# Actions: repo `Authio-com/authio_create-app`, workflow `publish.yml`).
# npm only allows that once the package exists, so the very first version
# has to be published by hand.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with: { version: 10 }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          # No registry-url: its generated .npmrc sends an empty token
          # instead of letting npm fall back to OIDC.
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # OIDC needs npm >= 11.5.1, newer than the npm bundled with Node 22.
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          npm install -g npm@latest
          npm --version
          npm publish --provenance --access public
